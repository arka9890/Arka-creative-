<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Stickman elephant walking</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="3" dy="5" result="offset"/>
      <feFlood flood-color="#1e1b4b" flood-opacity="0.20" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="560" fill="#ffffff"/>
  <!-- ground line -->
  <line x1="80" y1="468" x2="720" y2="468" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

  <g filter="url(#shadow)" stroke="#111111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- spine: hip to shoulder, then neck to head -->
    <path d="M 350 272 Q 420 250 480 252" stroke-width="7"/>
    <path d="M 480 252 L 500 216" stroke-width="7"/>
    <!-- stick legs -->
    <path d="M 480 252 L 502 340 L 494 460" stroke-width="7"/>
    <path d="M 480 252 L 452 342 L 468 460" stroke-width="7"/>
    <path d="M 350 272 L 328 352 L 336 460" stroke-width="7"/>
    <path d="M 350 272 L 374 348 L 386 460" stroke-width="7"/>
    <!-- tail -->
    <path d="M 350 272 C 296 260 280 300 296 345" stroke-width="5"/>
  </g>

  <!-- ear ellipse sits BEHIND the head, poking out at top-back -->
  <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="505" cy="148" rx="70" ry="56" fill="#c9cdd4" stroke-width="4.5"/>
    <path d="M 468 116 C 500 98 545 104 562 132" fill="none" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- head (white disc covers most of the ear) -->
  <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="540" cy="180" r="58" fill="#ffffff" stroke-width="6"/>
  </g>

  <g filter="url(#shadow)" stroke="#111111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- trunk: exits the mouth and hangs nearly to the ground -->
    <path d="M 560 236 C 596 246 602 288 600 330 C 599 372 596 408 588 436" stroke-width="10"/>
  </g>

  <!-- face -->
  <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="568" cy="166" r="6" fill="#111111"/>
  </g>

  <!-- tail tuft -->
  <g stroke="#111111" stroke-linecap="round" fill="none">
    <path d="M 296 345 L 288 362 M 296 345 L 296 364 M 296 345 L 306 360" stroke-width="3"/>
  </g>
</svg>
