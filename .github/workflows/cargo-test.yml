name: Rust cargo check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        working-directory: android-ai-video-agent/rust
        run: |
          cargo check
          cargo test
