name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set NDK env (use pre-installed NDK)
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ | head -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android x86_64-linux-android

      - name: Run Rust tests
        working-directory: android-ai-video-agent/rust
        run: cargo test

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust native (cargo-ndk)
        working-directory: android-ai-video-agent/rust
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build APK
        working-directory: android-ai-video-agent
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-ai-video-agent/app/build/outputs/apk/debug/*.apk