name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set NDK env
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ | head -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run Rust tests
        working-directory: android-ai-video-agent/rust
        run: cargo test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-ai-video-agent/release-keystore.jks
          test -s android-ai-video-agent/release-keystore.jks

      - name: Build Rust native
        working-directory: android-ai-video-agent/rust
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build release APK
        working-directory: android-ai-video-agent
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/android-ai-video-agent/release-keystore.jks
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-ai-video-agent/app/build/outputs/apk/release/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: android-ai-video-agent/app/build/outputs/apk/release/*.apk
